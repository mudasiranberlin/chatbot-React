<!DOCTYPE html>
<html>

<head>
    <title>Chatbot</title>
</head>

<body>

    <!-- <img src="/robot.png" alt="user" width="50" /> -->
    <div class="js-container"></div>

    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>

    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script type="text/babel">

        function ChatbotInput() {
            return (
                <>
                    <input placeholder="Please enter" type="text" size="50" />
                    <button>Submit</button>
                </>
            )

        }

        function Chatmessage({ message, sender }) {

            if (sender === "robot") {
                return (
                    <div>
                        <img src="/robot.png" alt="user" width="50" />
                        {message}

                    </div>

                )

            }
            return (
                <div>
                    {sender === "robot" && <img src="/robot.png" alt="user" width="50" />}
                    {message}
                    {sender === "user" && <img src="/user.png" alt="user" width="50" />}

                </div>

            )
        }

        function App() {
            const chatMessages= [];
            return(
                <>
                <ChatbotInput />
                <Chatmessage message="Hello chatbot" sender="user" />
                <Chatmessage message="Hello! How can I help you?" sender="robot" />
                <Chatmessage message="can you give me todays date" sender="user" />
                <Chatmessage message="Today is September 28" sender="robot" />
            </>

            )
        }
        const container = document.querySelector('.js-container');
        ReactDOM.createRoot(container).render(<App/>);
    </script>
</body>

</html>
