<!DOCTYPE html>
<html>

<head>
    <title>Chatbot</title>
</head>

<body>

    <!-- <img src="/robot.png" alt="user" width="50" /> -->
    <div class="js-container"></div>

    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>

    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script type="text/babel">

        function ChatbotInput() {
            return (
                <>
                    <input placeholder="Please enter" type="text" size="50" />
                    <button>Submit</button>
                </>
            )

        }

        function Chatmessage({ message, sender }) {

            if (sender === "robot") {
                return (
                    <div>
                        <img src="/robot.png" alt="user" width="50" />
                        {message}

                    </div>

                )

            }
            return (
                <div>
                    {sender === "robot" && <img src="/robot.png" alt="user" width="50" />}
                    {message}
                    {sender === "user" && <img src="/user.png" alt="user" width="50" />}

                </div>

            )
        }

        function ChatMessages() {
            const chatMessages= [
                {
                    id:"id1",
                    sender:'user',
                    message:"Hello chatbot"
                },
                {
                    id:"id2",
                    sender:'robot',
                    message:"Hello! How can I help you?"
                },
                {
                    id:"id3",
                    sender:'user',
                    message:"can you give me todays date"
                },
                {
                    id:"id4",
                    sender:'robot',
                    message:"Today is September 28"
                },
            ];

            function sendMessage() {
                console.log("Message recived");
                
            }

            return(
                <>
               <button onClick={sendMessage} >Send message</button>
                {chatMessages.map((chatMessage)=>{
                return(
                    <Chatmessage message={chatMessage.message} sender={chatMessage.sender} key={chatMessage.id}/>
                )

            })}

                </>
            )
        }

        

        function App() {
            
        
            return(
                <>
                <ChatbotInput />
                <ChatMessages/>
               
            </>

            )
        }
        const container = document.querySelector('.js-container');
        ReactDOM.createRoot(container).render(<App/>);
    </script>
</body>

</html>
